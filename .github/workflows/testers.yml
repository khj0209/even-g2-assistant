name: Even Hub beta testers

# Invite, remove or list beta testers from the Actions tab (Run workflow).
# Runs here rather than on a phone/laptop because the Even Hub login lives in EVENHUB_CREDENTIALS
# and every refresh rotates it; using the CLI elsewhere would revoke the stored login.
# The repository is public, so tester emails are masked in the logs.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [add, rm, list]
        default: add
      emails:
        description: Emails, separated by commas (not needed for list)
        required: false

concurrency: even-hub-release

permissions:
  contents: read

jobs:
  testers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Hide emails in logs
        env:
          EMAILS: ${{ inputs.emails }}
        run: |
          printf '%s' "$EMAILS" | tr ',;' '\n\n' | while read -r e; do
            e=$(echo "$e" | xargs)
            [ -n "$e" ] && echo "::add-mask::$e"
          done
          echo "ok"

      - name: Restore Even Hub login
        env:
          EVENHUB_CREDENTIALS: ${{ secrets.EVENHUB_CREDENTIALS }}
        run: |
          if [ -z "$EVENHUB_CREDENTIALS" ]; then
            echo "::error::Repository secret EVENHUB_CREDENTIALS is not set. See README (배포)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/xdg/evenhub"
          printf '%s\n' "$EVENHUB_CREDENTIALS" > "$RUNNER_TEMP/xdg/evenhub/credentials.yaml"
          chmod 600 "$RUNNER_TEMP/xdg/evenhub/credentials.yaml"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          sha256sum "$RUNNER_TEMP/xdg/evenhub/credentials.yaml" | cut -d' ' -f1 > "$RUNNER_TEMP/credentials.sha"

      - name: Update testers
        env:
          ACTION: ${{ inputs.action }}
          EMAILS: ${{ inputs.emails }}
        run: |
          # Every email in the output (other testers' too) is shortened to its first letter.
          mask() { sed -E 's/([A-Za-z0-9._%+-])[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+)/\1***@\2/g'; }
          set -o pipefail
          case "$ACTION" in
            add|rm)
              if [ -z "$(echo "$EMAILS" | xargs)" ]; then echo "::error::Enter at least one email."; exit 1; fi
              npx evenhub testers "$ACTION" "$EMAILS" 2>&1 | mask
              ;;
          esac
          npx evenhub testers 2>&1 | mask

      # Runs even when an earlier step failed: a refresh may already have revoked the stored login.
      - name: Save refreshed login
        if: always()
        env:
          GH_TOKEN: ${{ secrets.EVENHUB_SECRET_WRITER }}
        run: |
          file="$RUNNER_TEMP/xdg/evenhub/credentials.yaml"
          [ -f "$file" ] && [ -f "$RUNNER_TEMP/credentials.sha" ] || exit 0
          if [ "$(sha256sum "$file" | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/credentials.sha")" ]; then
            echo "Login unchanged."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The Even Hub login was refreshed, but EVENHUB_SECRET_WRITER is not set, so it could not be saved. The stored login is now revoked: log in again and update EVENHUB_CREDENTIALS."
            exit 1
          fi
          gh secret set EVENHUB_CREDENTIALS --repo "$GITHUB_REPOSITORY" < "$file"
          echo "Saved the refreshed Even Hub login."
